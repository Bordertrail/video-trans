name: Windows x64

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  installer:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the installer
        run: npm run build:windows
      - name: Test conversion, previews and output handling
        shell: pwsh
        run: |
          $env:VIDEO_TRANS_FFMPEG = Join-Path $PWD 'src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe'
          $env:VIDEO_TRANS_FFPROBE = Join-Path $PWD 'src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe'
          $env:VIDEO_TRANS_FONT = Join-Path $PWD 'src-tauri/resources/NotoSansCJKsc-Regular.otf'
          cargo test --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc -- --include-ignored
      - uses: actions/upload-artifact@v4
        with:
          name: video-trans-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
